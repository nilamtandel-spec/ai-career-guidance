{% extends 'layout.html' %}
{% block title %}Assessment{% endblock %}

{% block content %}
<div class="assessment-card">
    <h2>Career Assessment Test</h2>
    <form method="POST">
        {% for question in questions %}
            <div class="question-block">
                <p><strong>Q{{ loop.index }}. {{ question.question_text }}</strong></p>

                <label><input type="radio" name="question_{{ question.id }}" value="A" required> {{ question.option_a }}</label><br>
                <label><input type="radio" name="question_{{ question.id }}" value="B" required> {{ question.option_b }}</label><br>
                <label><input type="radio" name="question_{{ question.id }}" value="C" required> {{ question.option_c }}</label><br>
                <label><input type="radio" name="question_{{ question.id }}" value="D" required> {{ question.option_d }}</label>
            </div>
        {% endfor %}

        <button type="submit" class="btn">Submit Assessment</button>
    </form>
</div>
{% endblock %}

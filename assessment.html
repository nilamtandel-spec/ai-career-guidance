{% extends 'layout.html' %}
{% block title %}Assessment{% endblock %}

{% block content %}

<div class="assessment-wrapper">

    <div class="assessment-header">
        <h1>Career Assessment Test</h1>
        <p>Answer all questions carefully to get your best career suggestion.</p>
    </div>

    <form method="POST">

        {% for q in questions %}
        <div class="question-card">
            <h3>Q{{ loop.index }}. {{ q.question_text }}</h3>

            <label>
                <input type="radio" name="question_{{ q.id }}" value="A" required>
                <span>{{ q.option_a }}</span>
            </label>

            <label>
                <input type="radio" name="question_{{ q.id }}" value="B">
                <span>{{ q.option_b }}</span>
            </label>

            <label>
                <input type="radio" name="question_{{ q.id }}" value="C">
                <span>{{ q.option_c }}</span>
            </label>

            <label>
                <input type="radio" name="question_{{ q.id }}" value="D">
                <span>{{ q.option_d }}</span>
            </label>
        </div>
        {% endfor %}

        <button type="submit" class="submit-btn">Submit Assessment</button>

    </form>

</div>

<style>
.assessment-wrapper {
    max-width: 950px;
    margin: 40px auto;
}

.assessment-header {
    background: #ffffff !important;
    padding: 28px;
    border-radius: 18px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.assessment-header h1 {
    color: #111827 !important;
    margin-bottom: 8px;
}

.assessment-header p {
    color: #374151 !important;
}

.question-card {
    background: #ffffff !important;
    padding: 24px;
    border-radius: 18px;
    margin-bottom: 22px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.question-card h3 {
    color: #111827 !important;
    margin-bottom: 18px;
    font-size: 20px;
}

.question-card label {
    display: block;
    padding: 13px 15px;
    margin-bottom: 10px;
    border-radius: 12px;
    background: #f8fafc !important;
    color: #111827 !important;
    cursor: pointer;
    font-size: 16px;
}

.question-card label span {
    color: #111827 !important;
}

.question-card label:hover {
    background: #e0f2fe !important;
}

.question-card input {
    margin-right: 10px;
}

.submit-btn {
    padding: 15px 30px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: white !important;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}
</style>

{% endblock %}

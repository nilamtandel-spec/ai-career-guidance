<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .chat-wrap{
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .chat-box{
            height: 420px;
            overflow-y: auto;
            border: 1px solid #dbeafe;
            border-radius: 14px;
            padding: 15px;
            background: #f8fbff;
            margin-bottom: 15px;
        }
        .msg{
            margin-bottom: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            max-width: 75%;
        }
        .user{
            background: #2563eb;
            color: white;
            margin-left: auto;
        }
        .bot{
            background: #e2e8f0;
            color: #111827;
        }
        .chat-input{
            display: flex;
            gap: 10px;
        }
        .chat-input input{
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }
        .chat-input button{
            padding: 12px 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-wrap">
        <h2>🤖 AI Career Guidance Chatbot</h2>
        <p>Ask anything about careers, courses, skills, or future job options.</p>

        <div id="chatBox" class="chat-box">
            <div class="msg bot">Hello! Ask me any career-related question.</div>
        </div>

        <div class="chat-input">
            <input type="text" id="msg" placeholder="Type your question here...">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        async function sendMsg() {
            const input = document.getElementById("msg");
            const chatBox = document.getElementById("chatBox");
            const message = input.value.trim();

            if (!message) return;

            chatBox.innerHTML += `<div class="msg user">${message}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            chatBox.innerHTML += `<div class="msg bot" id="loadingMsg">Thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/ask-ai", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                const loading = document.getElementById("loadingMsg");
                if (loading) loading.remove();

                chatBox.innerHTML += `<div class="msg bot">${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                const loading = document.getElementById("loadingMsg");
                if (loading) loading.remove();

                chatBox.innerHTML += `<div class="msg bot">Something went wrong. Please try again.</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        document.getElementById("msg").addEventListener("keypress", function(e){
            if(e.key === "Enter"){
                sendMsg();
            }
        });
    </script>
</body>
</html>

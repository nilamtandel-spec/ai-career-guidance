{% extends 'layout.html' %}
{% block title %}History{% endblock %}

{% block content %}

<h1>Chat History</h1>

<div class="card">

{% for chat in chats %}
<p><strong>You:</strong> {{ chat.user_message }}</p>
<p><strong>Bot:</strong> {{ chat.bot_reply }}</p>
<hr>
{% endfor %}

</div>

{% endblock %}

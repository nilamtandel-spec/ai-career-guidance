<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CareerPilot AI{% endblock %}</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:linear-gradient(135deg,#07152b,#123c69,#0b132b);
color:white;
min-height:100vh;
}

/* Navbar */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
font-size:20px;
font-weight:700;
}

.nav-links a{
margin-left:18px;
text-decoration:none;
color:white;
font-size:14px;
transition:0.3s;
}

.nav-links a:hover{
color:#38bdf8;
}

/* Admin Button */
.admin-btn{
background:linear-gradient(135deg,#f97316,#ef4444);
padding:8px 14px;
border-radius:10px;
color:white !important;
font-weight:700;
}

/* Container */
.container{
max-width:1100px;
margin:40px auto;
padding:20px;
}

/* Card */
.card{
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:18px;
box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* Buttons */
.btn{
display:inline-block;
padding:12px 20px;
border-radius:12px;
background:linear-gradient(135deg,#38bdf8,#2563eb);
color:white;
font-weight:600;
text-decoration:none;
margin-top:10px;
}

/* Footer */
.footer{
text-align:center;
padding:20px;
margin-top:40px;
font-size:13px;
opacity:0.7;
}
</style>

</head>

<body>

<!-- Navbar -->
<div class="navbar">
<div class="logo">CareerPilot AI</div>

<div class="nav-links">

    {% if session.get('admin_id') %}
        <a href="{{ url_for('admin_dashboard') }}">Admin Panel</a>
        <a href="{{ url_for('logout') }}">Logout</a>

    {% elif session.get('user_id') %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('assessment') }}">Assessment</a>
        <a href="{{ url_for('chatbot') }}">Chatbot</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('admin_login') }}" class="admin-btn">Admin</a>
        <a href="{{ url_for('logout') }}">Logout</a>

    {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
        <a href="{{ url_for('admin_login') }}" class="admin-btn">Admin</a>
    {% endif %}

</div>
</div>

<!-- Content -->
<div class="container">
{% block content %}{% endblock %}
</div>

<!-- Footer -->
<div class="footer">
© 2026 CareerPilot AI • Smart Career Guidance System
</div>

</body>
</html>

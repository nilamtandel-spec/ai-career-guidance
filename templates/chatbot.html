<!DOCTYPE html>
<html>
<head>
<title>Test Chatbot</title>
</head>

<body style="margin:0;font-family:Arial;background:#07152b;color:white;">

<h1 style="color:red;position:fixed;top:0;left:0;z-index:9999;background:white;padding:10px;">
NEW CHATBOT FILE LOADED
</h1>

<div style="height:100vh;display:flex;flex-direction:column;padding-top:70px;">

    <div id="chatBox" style="flex:1;overflow-y:auto;padding:20px;background:#123c69;">
        <div style="background:#334155;padding:12px;border-radius:10px;margin-bottom:10px;">
            Hello 👋 Ask me anything.
        </div>
    </div>

    <div style="display:flex;padding:15px;background:#020617;">
        <input id="userInput" style="flex:1;padding:15px;border-radius:8px;border:none;" placeholder="Type message...">
        <button onclick="sendMessage()" style="padding:15px 25px;margin-left:10px;">Send</button>
    </div>

</div>

<script>
function scrollBottom(){
    var box = document.getElementById("chatBox");
    box.scrollTop = box.scrollHeight;
}

function addMessage(text, align){
    var box = document.getElementById("chatBox");
    var div = document.createElement("div");

    div.style.padding = "12px";
    div.style.borderRadius = "10px";
    div.style.marginBottom = "10px";
    div.style.maxWidth = "70%";
    div.style.background = align === "right" ? "#2563eb" : "#334155";
    div.style.marginLeft = align === "right" ? "auto" : "0";
    div.innerText = text;

    box.appendChild(div);
    setTimeout(scrollBottom, 50);
}

function sendMessage(){
    var input = document.getElementById("userInput");
    var msg = input.value.trim();

    if(!msg) return;

    addMessage(msg, "right");
    input.value = "";

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    })
    .then(res => res.json())
    .then(data => {
        addMessage(data.reply || "No reply", "left");
    })
    .catch(() => {
        addMessage("Error connecting to chatbot.", "left");
    });
}

document.getElementById("userInput").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        sendMessage();
    }
});
</script>

</body>
</html>

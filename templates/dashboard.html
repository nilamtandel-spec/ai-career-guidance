{% extends 'layout.html' %}
{% block title %}Dashboard{% endblock %}

{% block content %}

<h1>Welcome, {{ user_name }}</h1>

<div class="grid">

<div class="card">
<h2>Total Assessments</h2>
<p>{{ total_results }}</p>
</div>

<div class="card">
<h2>Total Chats</h2>
<p>{{ total_chats }}</p>
</div>

</div>

<div class="card">
<h2>Quick Actions</h2>

<a href="/assessment" class="btn">Start Assessment</a>
<a href="/chatbot" class="btn">Open Chatbot</a>

</div>

<style>
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.card h2{
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:bold;
}
</style>

{% endblock %}

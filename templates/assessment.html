{% extends 'layout.html' %}
{% block title %}Assessment{% endblock %}

{% block content %}

<h1>Career Assessment</h1>

<form method="POST">

{% set total = questions|length %}

{% for q in questions %}
<div class="card question">

<p><strong>Q{{ loop.index }}/{{ total }}. {{ q.question_text }}</strong></p>

<label><input type="radio" name="question_{{ q.id }}" value="A" required> {{ q.option_a }}</label>
<label><input type="radio" name="question_{{ q.id }}" value="B"> {{ q.option_b }}</label>
<label><input type="radio" name="question_{{ q.id }}" value="C"> {{ q.option_c }}</label>
<label><input type="radio" name="question_{{ q.id }}" value="D"> {{ q.option_d }}</label>

</div>
{% endfor %}

<button class="btn">Submit Assessment</button>

</form>

<style>
.question{
margin-bottom:20px;
}

label{
display:block;
margin:8px 0;
cursor:pointer;
}
</style>

{% endblock %}

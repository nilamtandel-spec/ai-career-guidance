{% extends 'layout.html' %}
{% block title %}Assessment{% endblock %}

{% block content %}

<div class="assessment-wrapper">

    <div class="assessment-header">
        <h1>Career Assessment Test</h1>
        <p>Answer all questions carefully to get the best career suggestion.</p>
    </div>

    <form method="POST">

        {% for q in questions %}
        <div class="question-card">
            <h3>Q{{ loop.index }}. {{ q.question_text }}</h3>

            <label><input type="radio" name="question_{{ q.id }}" value="A" required> {{ q.option_a }}</label>
            <label><input type="radio" name="question_{{ q.id }}" value="B"> {{ q.option_b }}</label>
            <label><input type="radio" name="question_{{ q.id }}" value="C"> {{ q.option_c }}</label>
            <label><input type="radio" name="question_{{ q.id }}" value="D"> {{ q.option_d }}</label>
        </div>
        {% endfor %}

        <button type="submit" class="submit-btn">Submit Assessment</button>

    </form>

</div>

<style>

/* Wrapper */
.assessment-wrapper {
    max-width: 950px;
    margin: 40px auto;
}

/* Header */
.assessment-header {
    background: #ffffff;
    padding: 28px;
    border-radius: 18px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.assessment-header h1 {
    color: #111827;
    margin-bottom: 8px;
}

.assessment-header p {
    color: #374151;
}

/* Question Card */
.question-card {
    background: #ffffff;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 20px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* Question Text */
.question-card h3 {
    color: #111827;
    margin-bottom: 15px;
}

/* Options */
.question-card label {
    display: block;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: #f8fafc;
    color: #111827;
    cursor: pointer;
    transition: 0.2s;
}

.question-card label:hover {
    background: #e0f2fe;
}

/* Radio */
.question-card input {
    margin-right: 8px;
}

/* Button */
.submit-btn {
    padding: 15px 30px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: white;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

</style>

{% endblock %}
